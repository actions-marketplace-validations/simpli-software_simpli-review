# Weekly full-repository AI security scan. Copy to .github/workflows/ai-scan.yml in each repository.
# Needs one secret: ANTHROPIC_API_KEY (repo or organization secret).
#
# What it does: reads the whole repository at the latest commit of the default branch, opens at most
# `scan.maxIssues` issues labelled `ai-scan` (created if missing) for the worst findings, and writes a
# spend report (tokens and an estimated cost in USD) to the job summary and to the `simpli-review-scan`
# artifact. See README.md, "AI scan". Cost is capped by `scan.maxInputTokens` and `scan.maxTurns` in
# .simpli-review/config.json; run it by hand first (Actions > AI scan > Run workflow) to see the real spend.
#
# Pin the actions by commit hash. The simpli-review line below carries a placeholder: replace
# <commit-sha> with the commit hash of a release that has scan mode (look the hash up with
#   gh api repos/simpli-software/simpli-review/git/ref/tags/<tag> --jq '.object.sha'
# and if that returns an annotated tag, resolve it with
#   gh api repos/simpli-software/simpli-review/git/tags/<sha> --jq '.object.sha' )
# and keep the version in the trailing comment. Dependabot can update hash-pinned actions.
name: AI scan

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC (off the hour, when scheduled runs are least delayed)
  workflow_dispatch:
    inputs:
      effort:
        description: "Reasoning effort: low, medium, high, xhigh or max. Empty uses scan.effort from the config (default high)."
        required: false
        default: ""
        type: string
      max-turns:
        description: "Upper bound on investigation turns. Empty uses scan.maxTurns from the config (default 60)."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write

# Two scans never overlap: a manual run waits for the scheduled one instead of cancelling it.
concurrency:
  group: ai-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 200 # history for the git_history tool
          persist-credentials: false
      - name: Scan
        uses: simpli-software/simpli-review@<commit-sha> # v1.x
        with:
          mode: scan
          name: AI scan # heading of the report
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          effort: ${{ inputs.effort }}
          max-turns: ${{ inputs.max-turns }}
      - name: Upload the scan report
        if: ${{ !cancelled() }} # a failed scan still spent money: keep its report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simpli-review-scan
          path: |
            simpli-review-scan.json
            simpli-review-scan.md
          if-no-files-found: warn
          retention-days: 90
