name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Support is best effort, with no SLA. Do not paste secrets, tokens or private code.
        For a security vulnerability, use private reporting (see SECURITY.md) instead of this form.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [review (pull request), scan, local]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal config (`.simpli-review/config.json`) and the kind of change reviewed is enough.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Only the failing lines, with anything private removed.
      render: text
